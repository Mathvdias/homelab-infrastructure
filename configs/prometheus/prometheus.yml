global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'node_exporter_dell'
    static_configs:
      - targets: ['dell-optiplex.local:9100']

  - job_name: 'node_exporter_pi'
    static_configs:
      - targets: ['localhost:9100']

  - job_name: 'tesouro_backend_go'
    static_configs:
      - targets: ['dell-optiplex.local:8080']
